<script>
// ── State ───────────────────────────────────────────────────────────────────
let tasks = [];
let loadToken = 0;
let sortCol = 'status', sortDir = 1;
let editId = null, deleteId = null;
let currentPage = 1;
let pageSize = 25;
let detailTask = null;
let todos = [];

// ── API helpers ─────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
    const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content },
        ...opts,
    });
    if (res.status === 204) return null;
    if (!res.ok) {
        let message = `${res.status} ${res.statusText}`;
        try {
            const payload = await res.json();
            if (payload?.error) message = payload.error;
        } catch (err) {}
        throw new Error(message);
    }
    return res.json();
}

function setLoading(on) {
    document.getElementById('loadingIndicator').innerHTML = on ? '<span class="spinner"></span>' : '';
}

function showError(msg) {
    const el = document.getElementById('errBanner');
    el.textContent = msg;
    el.classList.add('show');
}

function hideError() {
    document.getElementById('errBanner').classList.remove('show');
}

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadTasks() {
    const token = ++loadToken;
    setLoading(true);
    try {
        const nextTasks = await api('api/tasks');
        // A poll can overlap a save. Only the newest response may replace the
        // in-memory list, otherwise a slower stale response can undo an edit.
        if (token !== loadToken) return;
        tasks = nextTasks;
        hideError();
        rebuildFilters();
        render();
    } catch (err) {
        if (token !== loadToken) return;
        showError('Could not connect to server. Make sure the local PHP server is running.');
        document.getElementById('tbody').innerHTML = `<tr><td colspan="8"><div class="empty"><div class="icon">⚠️</div><div>Server not reachable</div></div></td></tr>`;
    } finally {
        if (token === loadToken) setLoading(false);
    }
}

function rebuildFilters() {
    const savedA = document.getElementById('fAssignee').value;
    const savedT = document.getElementById('fType').value;

    const assignees = [...new Set(tasks.flatMap(t => (t.ticketAssignee || t.assignee) ? (t.ticketAssignee || t.assignee).split(',').map(s => s.trim()) : []).filter(Boolean))].sort();
    const types     = [...new Set(tasks.flatMap(t => t.type ? t.type.split(',').map(s => s.trim()) : []).filter(Boolean))].sort();

    const sa = document.getElementById('fAssignee');
    const st = document.getElementById('fType');
    sa.innerHTML = '<option value="">Anyone</option>';
    st.innerHTML = '<option value="">Any type</option>';
    assignees.forEach(a => sa.insertAdjacentHTML('beforeend', `<option${a===savedA?' selected':''}>${a}</option>`));
    types.forEach(t => st.insertAdjacentHTML('beforeend', `<option${t===savedT?' selected':''}>${t}</option>`));
}

// ── Filter + Sort ────────────────────────────────────────────────────────────
function filtered() {
    const q  = document.getElementById('search').value.toLowerCase();
    const fs = document.getElementById('fStatus').value;
    const fa = document.getElementById('fAssignee').value;
    const fp = document.getElementById('fPriority').value;
    const ft = document.getElementById('fType').value;

    return tasks.filter(t => {
        if (!t.name) return false;
        if (q && !t.name.toLowerCase().includes(q) && !(t.assignee||'').toLowerCase().includes(q)) return false;
        if (fs && t.status !== fs) return false;
        if (fa && !((t.ticketAssignee || t.assignee || '').split(',').map(s => s.trim()).includes(fa))) return false;
        if (fp && t.priority !== fp) return false;
        if (ft && !(t.type||'').split(',').map(s => s.trim()).includes(ft)) return false;
        return true;
    }).sort((a, b) => {
        if (a.isTicket !== b.isTicket) return a.isTicket ? -1 : 1;
        let va = a[sortCol] || '', vb = b[sortCol] || '';
        if (sortCol === 'dueDate') {
            va = va ? new Date(va).getTime() : 9e15;
            vb = vb ? new Date(vb).getTime() : 9e15;
            return (va - vb) * sortDir;
        }
        return va.localeCompare(vb) * sortDir;
    });
}

function sort(col) {
    sortDir = sortCol === col ? sortDir * -1 : 1;
    sortCol = col;
    currentPage = 1;
    document.querySelectorAll('th span[id^="si-"]').forEach(el => el.textContent = '↕');
    const el = document.getElementById('si-' + col);
    if (el) el.textContent = sortDir === 1 ? '↑' : '↓';
    render();
}

function clearFilters() {
    document.getElementById('search').value = '';
    ['fStatus','fAssignee','fPriority','fType'].forEach(id => document.getElementById(id).value = '');
    currentPage = 1;
    render();
}

function goFirstPage() {
    currentPage = 1;
    updateClearButton();
    render();
}

function updateClearButton() {
    const hasActiveFilter = Boolean(
        document.getElementById('search').value.trim() ||
        document.getElementById('fStatus').value ||
        document.getElementById('fAssignee').value ||
        document.getElementById('fPriority').value ||
        document.getElementById('fType').value
    );
    document.getElementById('clearFiltersBtn').style.display = hasActiveFilter ? '' : 'none';
}

function setPageSize() {
    pageSize = Number(document.getElementById('pageSize').value) || 25;
    currentPage = 1;
    render();
}

function changePage(delta) {
    currentPage += delta;
    render();
}

// ── Render ───────────────────────────────────────────────────────────────────
const statusClass = { 'Done':'bd', 'In progress':'bp', 'Not started':'bn', 'On Hold/Waiting for Material':'bh', 'On hold':'bh', 'Waiting for material':'bh', 'Waiting for budget':'bh', 'Waiting for Approval':'ba', 'For Revision':'br', 'Open':'bn', 'New':'bn', 'Resolved':'bd', 'Closed':'bd' };
const statusLabel = { 'Done':'Done', 'In progress':'In Progress', 'Not started':'Not Started', 'On Hold/Waiting for Material':'On Hold', 'On hold':'On Hold', 'Waiting for material':'Waiting for Material', 'Waiting for budget':'Waiting for Budget', 'Waiting for Approval':'Waiting for Approval', 'For Revision':'For Revision', 'Open':'Open', 'New':'New', 'Resolved':'Resolved', 'Closed':'Closed' };
const prioClass   = { 'Urgent':'bhi', 'High':'bhi', 'Medium':'bme', 'Normal':'be', 'Low':'blo' };

function badge(cls, txt) { return `<span class="badge ${cls}">${e(txt)}</span>`; }

function fileLinks(files) {
    if (!files || !files.length) return '<span class="file-empty">None</span>';
    return `<div class="file-list">${files.map(f => `<a class="file-link" href="${e(f.url)}" title="${e(f.name)}">${e(f.name)}</a>`).join('')}</div>`;
}

function isPastDue(t) {
    return t.dueDate && !['Done', 'Resolved', 'Closed'].includes(t.status) && new Date(t.dueDate) < new Date();
}

function fmtDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function fmtTime(t) {
    if (!t) return '';
    return new Date('2000-01-01T' + t + ':00').toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}

function fmtDeadline(task) {
    const date = fmtDate(task.dueDate);
    return date && task.dueTime ? `${date} · ${fmtTime(task.dueTime)}` : date;
}

const APP_TIMEZONE = document.querySelector('meta[name="app-timezone"]')?.content || undefined;

// Stored timestamps come from the database in UTC as "YYYY-MM-DD HH:MM:SS".
function fmtStamp(value) {
    if (!value) return '';
    const date = new Date(value.replace(' ', 'T') + 'Z');
    return isNaN(date) ? '' : date.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', timeZone: APP_TIMEZONE});
}

function fmtCompleted(task) {
    if (!task.completedAt || !['Done', 'Resolved', 'Closed'].includes(task.status)) return '';
    return fmtStamp(task.completedAt);
}

function render() {
    updateClearButton();
    const rows = filtered();
    const all  = tasks.filter(t => t.name);
    const nativeTaskCount = all.filter(t => !t.isTicket).length;
    const ticketCount = tasks.filter(t => t.isTicket).length;
    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);
    const start = (currentPage - 1) * pageSize;
    const pageRows = rows.slice(start, start + pageSize);

    const c = {done:0, prog:0, ns:0, hold:0, appr:0, rev:0};
    all.forEach(t => {
        if (['Done', 'Resolved', 'Closed'].includes(t.status)) c.done++;
        else if (t.status === 'In progress') c.prog++;
        else if (['On Hold/Waiting for Material', 'On hold', 'Waiting for material', 'Waiting for budget'].includes(t.status)) c.hold++;
        else if (t.status === 'Waiting for Approval') c.appr++;
        else if (t.status === 'For Revision') c.rev++;
        else c.ns++;
    });

    document.getElementById('stats').innerHTML = `
        <div class="stat-card s-done"><div class="lbl">Done</div><div class="val">${c.done}</div></div>
        <div class="stat-card s-prog"><div class="lbl">In Progress</div><div class="val">${c.prog}</div></div>
        <div class="stat-card s-ns"><div class="lbl">Not Started</div><div class="val">${c.ns}</div></div>
        <div class="stat-card s-hold"><div class="lbl">On Hold</div><div class="val">${c.hold}</div></div>
        <div class="stat-card s-appr"><div class="lbl">Waiting for Approval</div><div class="val">${c.appr}</div></div>
        <div class="stat-card s-rev"><div class="lbl">For Revision</div><div class="val">${c.rev}</div></div>
        <div class="stat-card s-total"><div class="lbl">Total</div><div class="val">${all.length}</div></div>
    `;

    document.getElementById('tableCount').textContent = rows.length === all.length
        ? `${all.length} item${all.length === 1 ? '' : 's'} · ${nativeTaskCount} task${nativeTaskCount === 1 ? '' : 's'}, ${ticketCount} ticket${ticketCount === 1 ? '' : 's'}`
        : `${rows.length} of ${all.length} match your filters`;
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevPage').disabled = currentPage <= 1;
    document.getElementById('nextPage').disabled = currentPage >= totalPages;

    if (!rows.length) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="empty"><div>No tasks match your filters.</div></div></td></tr>`;
        return;
    }

    document.getElementById('tbody').innerHTML = pageRows.map(t => `
        <tr class="task-row ${t.isTicket ? 'ticket-row' : ''}" tabindex="0" role="button" aria-label="View details for ${e(t.name)}" onclick="openDetailsByKey('${t.isTicket ? 'ticket-' + t.ticketId : 'task-' + t.id}')" onkeydown="rowKeyDetails(event, '${t.isTicket ? 'ticket-' + t.ticketId : 'task-' + t.id}')">
            <td>
                <div class="t-name">${e(t.name)}</div>
                <div class="t-meta">
                    ${t.isTicket ? `<span class="ticket-pill">${e(t.ticketReference || 'Ticket')}</span>` : ''}
                    ${t.isTicket ? e(t.category || '') : e(t.type || '')}
                    ${isPastDue(t) ? '<span class="t-name-sub">Past due</span>' : ''}
                </div>
            </td>
            <td>${e(t.isTicket ? t.ticketAssignee : t.assignee) || '<span class="muted-dash">—</span>'}</td>
            <td class="hide-sm" style="color:${isPastDue(t)?'var(--hi-c)':'var(--muted)'}; white-space:nowrap">${fmtCompleted(t) ? `<span class="t-completed">Done ${fmtCompleted(t)}</span>` : (fmtDeadline(t) || '<span class="muted-dash">—</span>')}</td>
            <td>${badge(statusClass[t.status] || 'bn', statusLabel[t.status] || t.status)}</td>
            <td class="hide-sm">${t.priority ? badge(prioClass[t.priority] || '', t.priority) : '<span class="muted-dash">—</span>'}</td>
            <td class="hide-sm">${t.uploads?.length ? `<span class="files-count" title="${e(t.uploads.map(f => f.name).join(', '))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${t.uploads.length}</span>` : '<span class="muted-dash">—</span>'}</td>
        </tr>
    `).join('');
}

function e(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openDetailsByKey(key) {
    const isTicket = key.startsWith('ticket-');
    const id = Number(key.split('-')[1]);
    const task = tasks.find(item => isTicket ? item.isTicket && item.ticketId === id : !item.isTicket && item.id === id);
    if (task) openDetails(task);
}

function rowKeyDetails(event, key) {
    if (event.target.closest('button, a, input, select, textarea')) return;
    if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openDetailsByKey(key);
    }
}

async function openDetails(task) {
    detailTask = task;
    document.getElementById('detailKind').textContent = task.isTicket ? `Ticket no. ${task.ticketReference || ''}` : 'Task';
    document.getElementById('detailTitle').textContent = task.name;
    const details = [
        ['Status', statusLabel[task.status] || task.status], ['Assignee', task.ticketAssignee || task.assignee || '—'],
        ['Due', fmtDeadline(task) || '—'], ['Priority', task.priority || '—'],
        ['Type', task.category || task.type || '—'],
    ];
    if (fmtCompleted(task)) details.splice(1, 0, ['Completed', fmtCompleted(task)]);
    if (task.isTicket) details.push(['Requested by', task.requesterName || task.requesterEmail || '—']);
    if (task.department) details.push(['Department', task.department]);
    if (task.otherType) details.push(['Other type', task.otherType]);
    if (fmtStamp(task.updated_at)) details.push(['Updated', fmtStamp(task.updated_at)]);
    document.getElementById('detailGrid').innerHTML = details.map(([label, value]) => `<div class="detail-item"><span>${e(label)}</span><strong${label === 'Requested by' && task.requesterEmail ? ` title="${e(task.requesterEmail)}"` : ''}>${e(value)}</strong></div>`).join('');
    document.getElementById('detailDescription').textContent = task.desc || 'No description.';
    document.getElementById('detailFiles').innerHTML = task.uploads?.length ? task.uploads.map(file => `<a href="${e(file.url)}">${e(file.name)}</a>`).join('') : '<div class="todo-empty">No files attached.</div>';
    document.getElementById('detailActions').innerHTML = task.isTicket
        ? `<a class="btn btn-primary" href="tickets.php?edit=${encodeURIComponent(task.ticketId)}#${e(task.ticketReference || '')}">Edit ticket</a>`
        : `<button class="btn btn-primary" type="button" onclick="closeDetails();editTask(${task.id})">Edit task</button><button class="btn btn-ghost" type="button" style="color:var(--hi-c)" onclick="askDelete(${task.id})">Delete</button>`;
    document.getElementById('detailsOv').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.querySelector('.detail-close').focus();
    await loadTodos();
}

function closeDetails() {
    document.getElementById('detailsOv').classList.remove('open');
    document.body.style.overflow = '';
    detailTask = null;
    todos = [];
}

async function loadTodos() {
    if (!detailTask) return;
    const query = detailTask.isTicket ? `ticket_id=${detailTask.ticketId}` : `task_id=${detailTask.id}`;
    document.getElementById('todoList').innerHTML = '<div class="todo-empty">Loading checklist...</div>';
    try {
        todos = await api(`api/todos?${query}`);
        renderTodos();
    } catch (error) {
        document.getElementById('todoList').innerHTML = `<div class="todo-empty">${e(error.message)}</div>`;
    }
}

function renderTodos() {
    const list = document.getElementById('todoList');
    if (!todos.length) {
        list.innerHTML = '<div class="todo-empty">No checklist items yet.</div>';
        return;
    }
    list.innerHTML = todos.map(todo => `<div class="todo-item ${todo.completed ? 'done' : ''}"><input type="checkbox" aria-label="Mark ${e(todo.text)} complete" ${todo.completed ? 'checked' : ''} onchange="setTodo(${todo.id}, this.checked)"><span class="todo-text">${e(todo.text)}</span><button class="todo-delete" type="button" aria-label="Delete ${e(todo.text)}" onclick="deleteTodo(${todo.id})">&times;</button></div>`).join('');
}

async function addTodo(event) {
    event.preventDefault();
    if (!detailTask) return;
    const input = document.getElementById('todoText');
    const text = input.value.trim();
    if (!text) return;
    const button = document.getElementById('todoAddButton');
    button.disabled = true;
    try {
        const payload = { text, taskId: detailTask.isTicket ? null : detailTask.id, ticketId: detailTask.isTicket ? detailTask.ticketId : null };
        todos.push(await api('api/todos', { method: 'POST', body: JSON.stringify(payload) }));
        input.value = '';
        renderTodos();
        input.focus();
    } catch (error) { alert('Could not add to-do: ' + error.message); }
    finally { button.disabled = false; }
}

async function setTodo(id, completed) {
    try {
        const saved = await api(`api/todos/${id}`, { method: 'PUT', body: JSON.stringify({completed}) });
        todos = todos.map(todo => todo.id === id ? saved : todo);
        renderTodos();
    } catch (error) { alert('Could not update to-do: ' + error.message); await loadTodos(); }
}

async function deleteTodo(id) {
    try {
        await api(`api/todos/${id}`, {method: 'DELETE'});
        todos = todos.filter(todo => todo.id !== id);
        renderTodos();
    } catch (error) { alert('Could not delete to-do: ' + error.message); }
}

// ── CRUD ──────────────────────────────────────────────────────────────────────
function openModal(task) {
    editId = task?.id ?? null;
    document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'Add Task';
    document.getElementById('fName').value      = task?.name     || '';
    document.getElementById('fAssignee2').value = task?.assignee || '';
    document.getElementById('fDueDate').value   = task?.dueDate  || '';
    document.getElementById('fStatus2').value   = task?.status   || 'Not started';
    document.getElementById('fPriority2').value = task?.priority || '';
    document.getElementById('fEffort').value    = task?.effort   || '';
    document.getElementById('fType2').value     = task?.type     || '';
    document.getElementById('fDesc').value      = task?.desc     || '';
    document.getElementById('fFiles').value     = '';
    document.getElementById('existingFiles').innerHTML = task?.uploads?.length ? fileLinks(task.uploads) : '';
    document.getElementById('modalOv').classList.add('open');
    setTimeout(() => document.getElementById('fName').focus(), 50);
}

function closeModal() {
    document.getElementById('modalOv').classList.remove('open');
    editId = null;
}

async function saveTask() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { alert('Task name is required.'); return; }

    const data = {
        name,
        assignee: document.getElementById('fAssignee2').value.trim(),
        dueDate:  document.getElementById('fDueDate').value,
        status:   document.getElementById('fStatus2').value,
        priority: document.getElementById('fPriority2').value,
        effort:   document.getElementById('fEffort').value,
        type:     document.getElementById('fType2').value.trim(),
        desc:     document.getElementById('fDesc').value.trim(),
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
        const editingId = editId;
        let saved;
        if (editingId !== null) {
            saved = await api(`api/tasks/${editingId}`, { method: 'PUT', body: JSON.stringify(data) });
            await uploadSelectedFiles(saved.id);
        } else {
            saved = await api('api/tasks', { method: 'POST', body: JSON.stringify(data) });
            await uploadSelectedFiles(saved.id);
        }

        // Reflect the confirmed server response immediately. The subsequent
        // reload then reconciles attachments and changes made by other users.
        const index = tasks.findIndex(task => task.id === saved.id);
        if (index >= 0) tasks[index] = saved;
        else tasks.push(saved);
        closeModal();
        render();
        await loadTasks();
    } catch (err) {
        alert('Save failed: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Save Task';
    }
}

async function uploadSelectedFiles(taskId) {
    const input = document.getElementById('fFiles');
    if (!input.files.length) return;

    for (const file of input.files) {
        if (file.name.toLowerCase().endsWith('.mp4')) {
            throw new Error('MP4 files are not allowed.');
        }
    }

    const form = new FormData();
    form.append('task_id', taskId);
    [...input.files].forEach(file => form.append('files[]', file));

    const res = await fetch('api/uploads', { method: 'POST', headers: { 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content }, body: form });
    if (!res.ok) {
        let msg = `${res.status} ${res.statusText}`;
        try {
            const data = await res.json();
            msg = data.error || msg;
        } catch (err) {}
        throw new Error(msg);
    }
}

function editTask(id) {
    openModal(tasks.find(t => t.id === id));
}

function askDelete(id) {
    deleteId = id;
    const t = tasks.find(x => x.id === id);
    document.getElementById('confirmMsg').textContent = `Delete "${t?.name}"? This cannot be undone.`;
    document.getElementById('confirmOv').classList.add('open');
}

function closeConfirm() {
    document.getElementById('confirmOv').classList.remove('open');
    deleteId = null;
}

async function confirmDelete() {
    const btn = document.getElementById('deleteBtn');
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
        await api(`api/tasks/${deleteId}`, { method: 'DELETE' });
        closeConfirm();
        closeDetails();
        await loadTasks();
    } catch (err) {
        alert('Delete failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Delete';
    }
}

function backdropClose(e, ovId) {
    if (e.target.id !== ovId) return;
    if (ovId === 'detailsOv') closeDetails();
    else closeModal();
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeConfirm(); closeDetails(); }
});

loadTasks();
setInterval(() => {
    const modalOpen = document.querySelector('.overlay.open');
    if (!document.hidden && !modalOpen) loadTasks();
}, 5000);
</script>
