<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DB Viewer</title>
    <style>
        body { font-family: monospace; padding: 24px; background: #f9f9f9; }
        h2 { margin-bottom: 12px; }
        table { border-collapse: collapse; width: 100%; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 13px; }
        th { background: #eee; }
        tr:nth-child(even) { background: #f5f5f5; }
        .meta { color: #888; font-size: 12px; margin-bottom: 12px; }
        button { padding: 6px 14px; cursor: pointer; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h2>tasks.db — all rows</h2>
    <div class="meta" id="meta"></div>
    <button onclick="load()">Refresh</button>
    <table>
        <thead>
            <tr>
                <th>id</th><th>name</th><th>assignee</th><th>due_date</th>
                <th>status</th><th>priority</th><th>effort</th><th>type</th>
                <th>desc</th><th>updated_at</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
    <script>
        async function load() {
            const res = await fetch('api/tasks');
            const rows = await res.json();
            const sorted = rows.slice().sort((a, b) => b.id - a.id);
            document.getElementById('meta').textContent = `${rows.length} rows — latest first`;
            document.getElementById('tbody').innerHTML = sorted.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.name}</td>
                    <td>${r.assignee}</td>
                    <td>${r.dueDate}</td>
                    <td>${r.status}</td>
                    <td>${r.priority}</td>
                    <td>${r.effort}</td>
                    <td>${r.type}</td>
                    <td>${r.desc}</td>
                    <td>${r.updated_at}</td>
                </tr>
            `).join('');
        }
        load();
    </script>
</body>
</html>
