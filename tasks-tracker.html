<script>
// ── State ───────────────────────────────────────────────────────────────────
let tasks = [];
let sortCol = 'status', sortDir = 1;
let editId = null, deleteId = null;
let currentPage = 1;
let pageSize = 25;

// ── API helpers ─────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
    const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
    });
    if (res.status === 204) return null;
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
}

function setLoading(on) {
    document.getElementById('loadingIndicator').innerHTML = on ? '<span class="spinner"></span>' : '';
}

function showError(msg) {
    const el = document.getElementById('errBanner');
    el.textContent = msg;
    el.classList.add('show');
}

function hideError() {
    document.getElementById('errBanner').classList.remove('show');
}

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadTasks() {
    setLoading(true);
    try {
        tasks = await api('api/tasks');
        hideError();
        rebuildFilters();
        render();
    } catch (err) {
        showError('Could not connect to server. Make sure the local PHP server is running.');
        document.getElementById('tbody').innerHTML = `<tr><td colspan="8"><div class="empty"><div class="icon">⚠️</div><div>Server not reachable</div></div></td></tr>`;
    } finally {
        setLoading(false);
    }
}

function rebuildFilters() {
    const savedA = document.getElementById('fAssignee').value;
    const savedT = document.getElementById('fType').value;

    const assignees = [...new Set(tasks.flatMap(t => t.assignee ? t.assignee.split(',').map(s => s.trim()) : []).filter(Boolean))].sort();
    const types     = [...new Set(tasks.flatMap(t => t.type ? t.type.split(',').map(s => s.trim()) : []).filter(Boolean))].sort();

    const sa = document.getElementById('fAssignee');
    const st = document.getElementById('fType');
    sa.innerHTML = '<option value="">All Assignees</option>';
    st.innerHTML = '<option value="">All Types</option>';
    assignees.forEach(a => sa.insertAdjacentHTML('beforeend', `<option${a===savedA?' selected':''}>${a}</option>`));
    types.forEach(t => st.insertAdjacentHTML('beforeend', `<option${t===savedT?' selected':''}>${t}</option>`));
}

// ── Filter + Sort ────────────────────────────────────────────────────────────
function filtered() {
    const q  = document.getElementById('search').value.toLowerCase();
    const fs = document.getElementById('fStatus').value;
    const fa = document.getElementById('fAssignee').value;
    const fp = document.getElementById('fPriority').value;
    const ft = document.getElementById('fType').value;

    return tasks.filter(t => {
        if (!t.name) return false;
        if (q && !t.name.toLowerCase().includes(q) && !(t.assignee||'').toLowerCase().includes(q)) return false;
        if (fs && t.status !== fs) return false;
        if (fa && !(t.assignee||'').split(',').map(s => s.trim()).includes(fa)) return false;
        if (fp && t.priority !== fp) return false;
        if (ft && !(t.type||'').split(',').map(s => s.trim()).includes(ft)) return false;
        return true;
    }).sort((a, b) => {
        let va = a[sortCol] || '', vb = b[sortCol] || '';
        if (sortCol === 'dueDate') {
            va = va ? new Date(va).getTime() : 9e15;
            vb = vb ? new Date(vb).getTime() : 9e15;
            return (va - vb) * sortDir;
        }
        return va.localeCompare(vb) * sortDir;
    });
}

function sort(col) {
    sortDir = sortCol === col ? sortDir * -1 : 1;
    sortCol = col;
    currentPage = 1;
    document.querySelectorAll('th span[id^="si-"]').forEach(el => el.textContent = '↕');
    const el = document.getElementById('si-' + col);
    if (el) el.textContent = sortDir === 1 ? '↑' : '↓';
    render();
}

function clearFilters() {
    document.getElementById('search').value = '';
    ['fStatus','fAssignee','fPriority','fType'].forEach(id => document.getElementById(id).value = '');
    currentPage = 1;
    render();
}

function goFirstPage() {
    currentPage = 1;
    updateClearButton();
    render();
}

function updateClearButton() {
    const hasActiveFilter = Boolean(
        document.getElementById('search').value.trim() ||
        document.getElementById('fStatus').value ||
        document.getElementById('fAssignee').value ||
        document.getElementById('fPriority').value ||
        document.getElementById('fType').value
    );
    document.getElementById('clearFiltersBtn').style.display = hasActiveFilter ? '' : 'none';
}

function setPageSize() {
    pageSize = Number(document.getElementById('pageSize').value) || 25;
    currentPage = 1;
    render();
}

function changePage(delta) {
    currentPage += delta;
    render();
}

// ── Render ───────────────────────────────────────────────────────────────────
const statusClass = { 'Done':'bd', 'In progress':'bp', 'Not started':'bn', 'On Hold/Waiting for Material':'bh' };
const statusLabel = { 'Done':'Done', 'In progress':'In Progress', 'Not started':'Not Started', 'On Hold/Waiting for Material':'On Hold' };
const prioClass   = { 'High':'bhi', 'Medium':'bme', 'Low':'blo' };

function badge(cls, txt) { return `<span class="badge ${cls}">${e(txt)}</span>`; }

function fileLinks(files) {
    if (!files || !files.length) return '<span class="file-empty">None</span>';
    return `<div class="file-list">${files.map(f => `<a class="file-link" href="${e(f.url)}" title="${e(f.name)}">${e(f.name)}</a>`).join('')}</div>`;
}

function isPastDue(t) {
    return t.dueDate && t.status !== 'Done' && new Date(t.dueDate) < new Date();
}

function fmtDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function render() {
    updateClearButton();
    const rows = filtered();
    const all  = tasks.filter(t => t.name);
    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);
    const start = (currentPage - 1) * pageSize;
    const pageRows = rows.slice(start, start + pageSize);

    const c = {done:0, prog:0, ns:0, hold:0};
    all.forEach(t => {
        if (t.status === 'Done') c.done++;
        else if (t.status === 'In progress') c.prog++;
        else if (t.status === 'On Hold/Waiting for Material') c.hold++;
        else c.ns++;
    });

    document.getElementById('stats').innerHTML = `
        <div class="stat-card s-done"><div class="lbl">Done</div><div class="val">${c.done}</div></div>
        <div class="stat-card s-prog"><div class="lbl">In Progress</div><div class="val">${c.prog}</div></div>
        <div class="stat-card s-ns"><div class="lbl">Not Started</div><div class="val">${c.ns}</div></div>
        <div class="stat-card s-hold"><div class="lbl">On Hold</div><div class="val">${c.hold}</div></div>
        <div class="stat-card s-total"><div class="lbl">Total</div><div class="val">${all.length}</div></div>
    `;

    document.getElementById('tableCount').textContent = rows.length
        ? `Showing ${start + 1}-${start + pageRows.length} of ${rows.length} filtered tasks (${all.length} total)`
        : `Showing 0 of ${all.length} tasks`;
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevPage').disabled = currentPage <= 1;
    document.getElementById('nextPage').disabled = currentPage >= totalPages;

    if (!rows.length) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="9"><div class="empty"><div class="icon">📋</div><div>No tasks match your filters</div></div></td></tr>`;
        return;
    }

    document.getElementById('tbody').innerHTML = pageRows.map(t => `
        <tr>
            <td>
                <div class="t-name">${e(t.name)}</div>
                ${isPastDue(t) ? '<div class="t-name-sub">⏰ Past Due</div>' : ''}
            </td>
            <td>${e(t.assignee) || '<span style="color:var(--muted)">—</span>'}</td>
            <td class="hide-sm" style="color:${isPastDue(t)?'var(--hi-c)':'var(--muted)'}; white-space:nowrap">${fmtDate(t.dueDate) || '—'}</td>
            <td>${badge(statusClass[t.status] || 'bn', statusLabel[t.status] || t.status)}</td>
            <td class="hide-sm">${t.priority ? badge(prioClass[t.priority] || '', t.priority) : ''}</td>
            <td class="hide-sm">${t.effort ? badge('be', t.effort) : ''}</td>
            <td class="hide-sm"><div class="t-type">${e(t.type)}</div></td>
            <td>${fileLinks(t.uploads)}</td>
            <td>
                <div class="t-actions">
                    <button class="btn btn-ghost btn-sm" onclick="editTask(${t.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="askDelete(${t.id})">Del</button>
                </div>
            </td>
        </tr>
    `).join('');
}

function e(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── CRUD ──────────────────────────────────────────────────────────────────────
function openModal(task) {
    editId = task?.id ?? null;
    document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'Add Task';
    document.getElementById('fName').value      = task?.name     || '';
    document.getElementById('fAssignee2').value = task?.assignee || '';
    document.getElementById('fDueDate').value   = task?.dueDate  || '';
    document.getElementById('fStatus2').value   = task?.status   || 'Not started';
    document.getElementById('fPriority2').value = task?.priority || '';
    document.getElementById('fEffort').value    = task?.effort   || '';
    document.getElementById('fType2').value     = task?.type     || '';
    document.getElementById('fDesc').value      = task?.desc     || '';
    document.getElementById('fFiles').value     = '';
    document.getElementById('existingFiles').innerHTML = task?.uploads?.length ? fileLinks(task.uploads) : '';
    document.getElementById('modalOv').classList.add('open');
    setTimeout(() => document.getElementById('fName').focus(), 50);
}

function closeModal() {
    document.getElementById('modalOv').classList.remove('open');
    editId = null;
}

async function saveTask() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { alert('Task name is required.'); return; }

    const data = {
        name,
        assignee: document.getElementById('fAssignee2').value.trim(),
        dueDate:  document.getElementById('fDueDate').value,
        status:   document.getElementById('fStatus2').value,
        priority: document.getElementById('fPriority2').value,
        effort:   document.getElementById('fEffort').value,
        type:     document.getElementById('fType2').value.trim(),
        desc:     document.getElementById('fDesc').value.trim(),
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
        if (editId !== null) {
            const updated = await api(`api/tasks/${editId}`, { method: 'PUT', body: JSON.stringify(data) });
            await uploadSelectedFiles(updated.id);
        } else {
            const created = await api('api/tasks', { method: 'POST', body: JSON.stringify(data) });
            await uploadSelectedFiles(created.id);
        }
        closeModal();
        await loadTasks();
    } catch (err) {
        alert('Save failed: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Save Task';
    }
}

async function uploadSelectedFiles(taskId) {
    const input = document.getElementById('fFiles');
    if (!input.files.length) return;

    for (const file of input.files) {
        if (file.name.toLowerCase().endsWith('.mp4')) {
            throw new Error('MP4 files are not allowed.');
        }
    }

    const form = new FormData();
    form.append('task_id', taskId);
    [...input.files].forEach(file => form.append('files[]', file));

    const res = await fetch('api/uploads', { method: 'POST', body: form });
    if (!res.ok) {
        let msg = `${res.status} ${res.statusText}`;
        try {
            const data = await res.json();
            msg = data.error || msg;
        } catch (err) {}
        throw new Error(msg);
    }
}

function editTask(id) {
    openModal(tasks.find(t => t.id === id));
}

function askDelete(id) {
    deleteId = id;
    const t = tasks.find(x => x.id === id);
    document.getElementById('confirmMsg').textContent = `Delete "${t?.name}"? This cannot be undone.`;
    document.getElementById('confirmOv').classList.add('open');
}

function closeConfirm() {
    document.getElementById('confirmOv').classList.remove('open');
    deleteId = null;
}

async function confirmDelete() {
    const btn = document.getElementById('deleteBtn');
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
        await api(`api/tasks/${deleteId}`, { method: 'DELETE' });
        closeConfirm();
        await loadTasks();
    } catch (err) {
        alert('Delete failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Delete';
    }
}

function backdropClose(e, ovId) {
    if (e.target.id === ovId) closeModal();
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeConfirm(); }
});

loadTasks();
</script>
</body>
</html>
